name: Render Remotion video
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Render MP4
        run: |
          mkdir -p out
          npx remotion render src/index.ts ScoopyTips out/scoopy-tips.mp4 --codec h264
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: danz-honda-scoopy-video
          path: out/scoopy-tips.mp4
          if-no-files-found: error
